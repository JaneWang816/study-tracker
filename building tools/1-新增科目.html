<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具 1 - 新增科目</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 { font-size: 28px; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 16px; }
    .form-section {
      padding: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #2d3436;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }
    .hint {
      font-size: 12px;
      color: #636e72;
      margin-top: 4px;
    }
    .btn-generate {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .output-section {
      padding: 30px;
      background: #f8f9fa;
      border-top: 2px solid #e9ecef;
      display: none;
    }
    .output-section.show { display: block; }
    .instruction {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .instruction h3 {
      color: #1976d2;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .code-block {
      margin-bottom: 20px;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #2d3436;
      color: white;
      border-radius: 8px 8px 0 0;
    }
    .code-title {
      font-weight: 600;
      font-size: 14px;
    }
    .code-action {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-new { background: #00b894; color: white; }
    .badge-modify { background: #fdcb6e; color: #2d3436; }
    .btn-copy {
      padding: 6px 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-copy:hover { background: #5568d3; }
    .btn-copy.copied { background: #00b894; }
    .code-content {
      background: #282c34;
      color: #abb2bf;
      padding: 16px;
      border-radius: 0 0 8px 8px;
      overflow-x: auto;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 工具 1 - 新增科目</h1>
      <p>建立新的學習科目（如：數學、國語、自然）</p>
    </div>
    
    <div class="form-section">
      <div class="form-group">
        <label>科目 ID（英文）</label>
        <input type="text" id="subjectId" placeholder="例如：chinese, science, social">
        <div class="hint">用於路由和檔案名稱，只能用英文小寫</div>
      </div>
      
      <div class="form-group">
        <label>科目名稱（中文）</label>
        <input type="text" id="subjectName" placeholder="例如：國語、自然、社會">
      </div>
      
      <div class="form-group">
        <label>圖示 Emoji</label>
        <input type="text" id="subjectIcon" placeholder="例如：📚、🔬、🌍">
      </div>
      
      <div class="form-group">
        <label>主題色</label>
        <input type="color" id="subjectColor" value="#4ECDC4">
        <div class="hint">建議每個科目用不同顏色區分</div>
      </div>
      
      <button class="btn-generate" onclick="generate()">✨ 生成代碼</button>
    </div>
    
    <div class="output-section" id="output">
      <div class="instruction">
        <h3>📋 使用說明</h3>
        <p>1. 複製下方「修改 src/data/index.js」的代碼，加到現有科目後面</p>
        <p>2. 建立新資料夾 <code>src/data/{科目ID}/</code>，並新增 index.js 檔案</p>
      </div>
      
      <div class="code-block">
        <div class="code-header">
          <span class="code-title">📁 修改 src/data/index.js</span>
          <div class="code-action">
            <span class="badge badge-modify">修改</span>
            <button class="btn-copy" onclick="copyCode('code1')">複製</button>
          </div>
        </div>
        <pre class="code-content" id="code1"></pre>
      </div>
      
      <div class="code-block">
        <div class="code-header">
          <span class="code-title" id="newFileTitle">📁 新增檔案</span>
          <div class="code-action">
            <span class="badge badge-new">新增</span>
            <button class="btn-copy" onclick="copyCode('code2')">複製</button>
          </div>
        </div>
        <pre class="code-content" id="code2"></pre>
      </div>
    </div>
  </div>

  <script>
    function generate() {
      const id = document.getElementById('subjectId').value.trim();
      const name = document.getElementById('subjectName').value.trim();
      const icon = document.getElementById('subjectIcon').value.trim();
      const color = document.getElementById('subjectColor').value;
      
      if (!id || !name || !icon) {
        alert('請填寫所有欄位！');
        return;
      }
      
      // 代碼 1：修改 src/data/index.js
      const code1 = `// 在 import 區塊加入：
import ${id} from './${id}'

// 在 subjects 物件中加入：
  ${id}: {
    id: '${id}',
    name: '${name}',
    icon: '${icon}',
    color: '${color}',
    modules: ${id}
  },`;
      
      // 代碼 2：新增科目的 index.js
      const code2 = `// src/data/${id}/index.js
// ${name}科目模組匯出

// 匯入模組（建立模組後再加入）
// import moduleA from './moduleA'

export const ${id}Modules = {
  // 在此加入模組
  // moduleA: {
  //   id: 'moduleA',
  //   name: '模組名稱',
  //   icon: '📖',
  //   color: '${color}',
  //   desc: '模組描述',
  //   ...moduleA
  // }
}

export default ${id}Modules`;
      
      document.getElementById('code1').textContent = code1;
      document.getElementById('code2').textContent = code2;
      document.getElementById('newFileTitle').textContent = `📁 新增 src/data/${id}/index.js`;
      document.getElementById('output').classList.add('show');
    }
    
    function copyCode(id) {
      const code = document.getElementById(id).textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = event.target;
        btn.textContent = '✓ 已複製';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '複製';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>
</html>
