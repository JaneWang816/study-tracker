<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具 3 - 新增單元</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 { font-size: 28px; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 16px; }
    .form-section { padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #2d3436;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #fd79a8;
    }
    .hint { font-size: 12px; color: #636e72; margin-top: 4px; }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .btn-generate {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(253, 121, 168, 0.4);
    }
    .output-section {
      padding: 30px;
      background: #f8f9fa;
      border-top: 2px solid #e9ecef;
      display: none;
    }
    .output-section.show { display: block; }
    .instruction {
      background: #fce4ec;
      border-left: 4px solid #e91e63;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .instruction h3 { color: #c2185b; font-size: 16px; margin-bottom: 8px; }
    .code-block { margin-bottom: 20px; }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #2d3436;
      color: white;
      border-radius: 8px 8px 0 0;
    }
    .code-title { font-weight: 600; font-size: 14px; }
    .code-action { display: flex; gap: 8px; align-items: center; }
    .badge { padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-new { background: #00b894; color: white; }
    .badge-modify { background: #fdcb6e; color: #2d3436; }
    .btn-copy {
      padding: 6px 12px;
      background: #fd79a8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-copy:hover { background: #e84393; }
    .btn-copy.copied { background: #00b894; }
    .code-content {
      background: #282c34;
      color: #abb2bf;
      padding: 16px;
      border-radius: 0 0 8px 8px;
      overflow-x: auto;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 工具 3 - 新增單元</h1>
      <p>在模組下建立學習單元（如：整數運算、破音字辨識）</p>
    </div>
    
    <div class="form-section">
      <div class="form-row">
        <div class="form-group">
          <label>科目 ID</label>
          <input type="text" id="subjectId" placeholder="例如：math, chinese">
        </div>
        <div class="form-group">
          <label>模組 ID</label>
          <input type="text" id="moduleId" placeholder="例如：arithmetic, phonetic">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>單元 ID（英文）</label>
          <input type="text" id="topicId" placeholder="例如：integer, decimal, fraction">
        </div>
        <div class="form-group">
          <label>單元名稱（中文）</label>
          <input type="text" id="topicName" placeholder="例如：整數運算、小數運算">
        </div>
      </div>
      
      <div class="form-group">
        <label>圖示 Emoji</label>
        <input type="text" id="topicIcon" placeholder="例如：🔢、🔣、⅓">
      </div>
      
      <button class="btn-generate" onclick="generate()">✨ 生成代碼</button>
    </div>
    
    <div class="output-section" id="output">
      <div class="instruction">
        <h3>📋 使用說明</h3>
        <p>將下方代碼加入到 <code>src/data/{科目ID}/{模組ID}/config.js</code> 的 topics 陣列中</p>
      </div>
      
      <div class="code-block">
        <div class="code-header">
          <span class="code-title" id="title1">📁 修改 config.js</span>
          <div class="code-action">
            <span class="badge badge-modify">修改</span>
            <button class="btn-copy" onclick="copyCode('code1')">複製</button>
          </div>
        </div>
        <pre class="code-content" id="code1"></pre>
      </div>
    </div>
  </div>

  <script>
    function generate() {
      const subjectId = document.getElementById('subjectId').value.trim();
      const moduleId = document.getElementById('moduleId').value.trim();
      const topicId = document.getElementById('topicId').value.trim();
      const topicName = document.getElementById('topicName').value.trim();
      const topicIcon = document.getElementById('topicIcon').value.trim();
      
      if (!subjectId || !moduleId || !topicId || !topicName || !topicIcon) {
        alert('請填寫所有欄位！');
        return;
      }
      
      const code1 = `// 修改 src/data/${subjectId}/${moduleId}/config.js
// 在 topics 陣列中加入：

  { id: '${topicId}', name: '${topicName}', icon: '${topicIcon}' },`;
      
      document.getElementById('code1').textContent = code1;
      document.getElementById('title1').textContent = `📁 修改 src/data/${subjectId}/${moduleId}/config.js`;
      document.getElementById('output').classList.add('show');
    }
    
    function copyCode(id) {
      const code = document.getElementById(id).textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = event.target;
        btn.textContent = '✓ 已複製';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '複製';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>
</html>
